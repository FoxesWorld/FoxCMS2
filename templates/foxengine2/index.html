<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="foxescraft-theme-color" name="theme-color" content="#d9d4ce">
  <link rel="icon" type="image/png" href="/templates/foxengine2/assets/img/logo.png">
  <title>FoxesCraft</title>
  <script>
    (() => {
      const storageKey = 'foxescraft.color-theme'
      try {
        const stored = localStorage.getItem(storageKey)
        const theme = stored === 'light' || stored === 'dark'
          ? stored
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('#foxescraft-theme-color')?.setAttribute(
          'content',
          theme === 'dark' ? '#201b18' : '#d9d4ce',
        )
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    })()
  </script>
  <!-- foxescraft:styles -->
</head>
<body>
  <script id="foxescraft-bootstrap" type="application/json">{}</script>
  <div id="foxescraft-app"></div>
  <!-- foxescraft:scripts -->
</body>
</html>
